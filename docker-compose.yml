services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: routemuse
      POSTGRES_USER: routemuse
      POSTGRES_PASSWORD: routemuse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemuse -d routemuse"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://routemuse:routemuse@db:5432/routemuse
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_BASE_URL: http://localhost:8000 } }
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
